# my-org/triggered-repo/.github/workflows/triggered-workflow.yml
name: Triggered Workflow

on:
  workflow_call:
    inputs: 
      hi_var: 
        required: true
        type: string
    outputs: 
      out_var: 
        value: ${{jobs.build.outputs.my_output2}}
      out_sum:
        value: ${{jobs.build.outputs.my_output1}}
      

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      my_output1: ${{steps.calc.outputs.result}}
      my_output2: ${{steps.setvar.outputs.msg}}
    steps:
      - run: echo "${{ inputs.hi_var }}" 
        name: print the input
      - name: Run a script
        id: setvar
        run: echo "msg= ${{ inputs.hi_var }} - $newvar1" >>$GITHUB_OUTPUT
        env:
          newvar1: there!
      - name: Add numbers
        id: calc
        run: |
          a=5
          b=3
          sum=$((a + b))
          echo "result=$sum" >> $GITHUB_OUTPUT
      - name: printing hi there
        run: echo "msg= ${{ inputs.hi_var }} - $newvar1" 
        env:
          newvar1: there!







