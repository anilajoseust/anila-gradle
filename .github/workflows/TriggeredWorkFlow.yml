# my-org/triggered-repo/.github/workflows/triggered-workflow.yml
name: Triggered Workflow

on:
  workflow_call:
    inputs: 
      hi_var: 
        required: true
        type: string
    outputs: 
      out_var: 
        value: ${{jobs.build.outputs.my_output}}
      env:
          newvar1: there!

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      my_output: ${{steps.setvar.outputs.msg}}
    steps:
      - run: echo "${{ inputs.hi_var }}" 
        name: print the input
      - name: Run a script
        id: setvar
        run: echo "msg=This is the triggered workflow - $newvar1" >>$GITHUB_OUTPUT


