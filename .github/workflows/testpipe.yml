name: Hello World Workflow
on: [push]  # Triggers the workflow every time you push code
jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Greet the world
        run: echo "Hello, World!"
 
  checkout-code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v4
  find-path:
    runs-on: ubuntu-latest
    steps:
      - name: find the path
        run: pwd
  list-files:
    runs-on: ubuntu-latest
    steps:
      - name: list the files
        run: ls -ltr