name: Hello World Workflow
on: [push]  # Triggers the workflow every time you push code
jobs:
  say-hello:
    runs-on: ubuntu-latest
    outputs:
      value: ${{steps.hi.outputs.my_value}}
    steps:
      - name: Greet the world
        id: hi
        run: echo "my_value=Hello, World!" >> $GITHUB_OUTPUT
      
  checkout-code:
    runs-on: ubuntu-latest
    needs: say-hello
    steps:
      - name: checkout the code
        uses: actions/checkout@v4
      - name: find the path
        run: pwd
      - name: list the files
        run: ls -ltr
      - name: use value from say_hello
        run: echo "value is ${{needs.say_hello.outputs.my_value}}"


