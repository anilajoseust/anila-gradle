name: Branch-based jobs

on:
  push:
    branches:
      - main
      - feature/**   # matches feature branches like feature/x, feature/test

jobs:
  job1-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Run on main
        run: echo "This runs only on main branch"

  job2-feature:
    if: startsWith(github.ref, 'refs/heads/feature')
    runs-on: ubuntu-latest
    steps:
      - name: Run on feature branch
        run: echo "This runs only on feature branches"
